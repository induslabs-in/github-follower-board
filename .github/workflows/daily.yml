# The daily count of a GitHub follower board: followers, stars, watchers and visitors of every public repository
# of this repository's owner (an organisation or a user). Runs every day at 15:40 UTC (edit the cron line for
# another time; GitHub may start scheduled runs some minutes late) and when started by hand: Actions tab, then
# "Daily count", then "Run workflow". Optional settings, under Settings > Secrets and variables > Actions:
#   secret TRAFFIC_TOKEN     a read-only key for visitor numbers (how to make one: the README of
#                            https://github.com/induslabs-in/github-follower-board)
#   variable BOARD_TIMEZONE  time zone for dates on the page, such as Asia/Kolkata (default UTC)
#   variable BOARD_TITLE     name at the top of the page (default: the owner's display name)
name: Daily count
on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-count
  cancel-in-progress: false
jobs:
  count:
    # the public template itself never counts; every copy made from it does
    if: github.repository != 'induslabs-in/github-follower-board'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the board
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" board
      - name: Count
        id: count
        working-directory: board
        env:
          ORG: ${{ github.repository_owner }}
          BOARD_REPO: ${{ github.repository }}
          BOARD_TIMEZONE: ${{ vars.BOARD_TIMEZONE }}
          BOARD_TITLE: ${{ vars.BOARD_TITLE }}
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node collect.mjs
      - name: Save
        working-directory: board
        env:
          DAY: ${{ steps.count.outputs.day }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data charts
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit --quiet -m "Count for ${DAY}"
          git push --quiet origin HEAD:main
